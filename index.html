<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantanal &amp; Iguazú Falls</title>
  <meta name="description" content="Wildlife collages from the Pantanal and Iguazú Falls." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css?v=dd3ea344" />
</head>
<body>
  <header class="site-header" id="top">
    <h1>Pantanal &amp; <em>Iguazú Falls</em></h1>
    <nav class="chapter-nav" id="chapter-nav" aria-label="Collage themes"></nav>
  </header>

  <main class="main-content" id="collages-container"></main>

  <!-- Full-Screen Lightbox Modal -->
  <div class="lightbox" id="lightbox-modal" role="dialog" aria-modal="true" aria-labelledby="lb-species-title">
    <div class="lightbox-dialog">
      <div class="lightbox-stage" id="lb-stage">
        <div class="lb-stage-variants" id="lb-stage-variants" role="tablist" aria-label="Alternate views"></div>
        <button class="lb-nav-btn lb-prev" id="lb-prev-btn" aria-label="Previous">←</button>
        <div id="lb-media-holder"></div>
        <button class="lb-nav-btn lb-next" id="lb-next-btn" aria-label="Next">→</button>
      </div>

      <div class="lightbox-info">
        <div>
          <div class="lb-header-row">
            <span class="lb-group-tag" id="lb-group-label">Jaguars</span>
            <button class="lb-close" id="lb-close-btn" aria-label="Close">✕</button>
          </div>
          <h2 class="lb-species" id="lb-species-title">Species</h2>
          <div class="lb-info-variants" id="lb-info-variants" role="tablist" aria-label="Alternate views"></div>
          <p class="lb-caption" id="lb-caption-text"></p>

          <button class="btn-small" id="lb-toggle-edit-btn">✎ Edit Caption</button>
          <div class="lb-edit-box" id="lb-edit-container">
            <textarea id="lb-edit-textarea" aria-label="Edit caption"></textarea>
            <div class="lb-edit-actions">
              <button class="btn-small primary" id="lb-save-caption-btn">Save</button>
              <button class="btn-small" id="lb-cancel-caption-btn">Cancel</button>
            </div>
          </div>
        </div>

        <div class="lb-footer-meta">
          <span id="lb-meta-region">Pantanal, Brazil</span>
          <span>·</span>
          <a id="lb-google-link" href="https://photos.app.goo.gl/167Lj3rTJHgkACwo6" target="_blank" rel="noopener noreferrer">View in Google Photos ↗</a>
        </div>
      </div>
    </div>
  </div>

  <script src="data/wildlife_data.js?v=dd3ea344"></script>
  <script src="app.js?v=dd3ea344"></script>
</body>
</html>
